included:
  - submodules/AuthorizationUI/Sources
  - submodules/ChatListUI/Sources
  - submodules/DebugSettingsUI/Sources
  - submodules/TelegramUIPreferences/Sources
  - submodules/TelegramUI/Sources

excluded:
  - third-party
  - buck-out
  - bazel-out
  - build-input
  - build-artifacts

disabled_rules:
  - colon
  - comment_spacing
  - control_statement
  - cyclomatic_complexity
  - empty_count
  - empty_parentheses_with_trailing_closure
  - file_length
  - force_cast
  - for_where
  - function_body_length
  - function_name_whitespace
  - function_parameter_count
  - identifier_name
  - implicit_optional_initialization
  - inclusive_language
  - large_tuple
  - legacy_constructor
  - legacy_random
  - line_length
  - nesting
  - no_space_in_method_call
  - non_optional_string_data_conversion
  - opening_brace
  - redundant_discardable_let
  - redundant_void_return
  - sorted_imports
  - switch_case_alignment
  - todo
  - trailing_comma
  - trailing_whitespace
  - type_body_length
  - type_name
  - unneeded_override
  - unused_closure_parameter
  - unused_optional_binding
  - vertical_whitespace

opt_in_rules:
  - first_where

reporter: "xcode"
